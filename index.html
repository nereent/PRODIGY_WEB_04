<!DOCTYPE html>
<html lang="en">
<head>
<title> Weather App </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet"/>
</head>

<body>
    <div class="container">
        <section class="items">
            <section class="inputs">
                <input type="text" placeholder="Enter Name City" id="cityinput">
                <input type="submit" value="Submit" id="add">
                <!-- <button placeholder="submit" id="add">submit</button> -->
            </section>

            <section class="display">
                <div class="wrapper" >
                    <h2 id="cityoutput"></h2>
                    <p id="description"></p>
                    <p id="temp"></p>
                    <p id="wind"></p>
                </div>
            </section>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
